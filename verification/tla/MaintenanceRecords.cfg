\* TLC configuration for MaintenanceRecords.tla (issue #1755).
\* Small finite model; run with: java -cp tla2tools.jar tlc2.TLC -config MaintenanceRecords.cfg MaintenanceRecords.tla
SPECIFICATION Spec

CONSTANTS
    AssetIds = {1, 2}
    TotalValue = 2
    MaxRecords = 3

\* A finite model can legitimately run out of enabled actions; that is not a bug.
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    Conservation
    UnregisteredHoldsNoValue
    NoOrphanedRecords
    HistoryAppendOnly
