[package]
name = "lifecycle-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.lifecycle]
path = "../contracts/lifecycle"

[dependencies.asset-registry]
path = "../contracts/asset-registry"

[dependencies.engineer-registry]
path = "../contracts/engineer-registry"

[dependencies.bridge]
path = "../contracts/bridge"

[dependencies.insurance-pool]
path = "../contracts/insurance-pool"

[dependencies.zk-privacy]
path = "../contracts/zk-privacy"

[dependencies.timestamping]
path = "../contracts/timestamping"

[dependencies.ed25519-dalek]
version = "2.2.0"

[dependencies.soroban-sdk]
version = "22.0.0"
features = ["testutils"]

[[bin]]
name = "zk_verifier_fuzz"
path = "fuzz_targets/zk_verifier_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attestation_message_fuzz"
path = "fuzz_targets/attestation_message_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "insurance_pool_share_premium_fuzz"
path = "fuzz_targets/insurance_pool_share_premium_fuzz.rs"
test = false
doc = false
bench = false

# Prevent this from being lifted into the parent workspace.
[workspace]
members = ["."]
