    const FEEDBACK_URL = "";

    const VOTE_KEY = "mainstay-faq-votes";
    const data = JSON.parse(document.getElementById("faq-data").textContent);
    const topicsById = Object.fromEntries(data.topics.map((t) => [t.id, t]));
    const search = document.getElementById("q");
    const statusEl = document.getElementById("status");
    const sectionsEl = document.getElementById("sections");
    const topicsEl = document.getElementById("topics");

    function readVotes() {
      try { return JSON.parse(localStorage.getItem(VOTE_KEY) || "{}"); } catch (e) { return {}; }
    }
    function saveVote(id, helpful) {
      try {
        const votes = readVotes();
        votes[id] = helpful;
        localStorage.setItem(VOTE_KEY, JSON.stringify(votes));
      } catch (e) { /* Storage can be blocked. The vote still counts in this view. */ }
    }
    function sendFeedback(payload) {
      if (!FEEDBACK_URL) return;
      try {
        fetch(FEEDBACK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ page: "faq", ...payload }),
          keepalive: true,
        }).catch(() => {});
      } catch (e) { /* Feedback is best effort. */ }
    }

    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs || {})) {
        if (key === "text") node.textContent = value;
        else node.setAttribute(key, value);
      }
      for (const child of children || []) node.append(child);
      return node;
    }
    // Render `code` spans as <code>, everything else as text.
    function inline(text) {
      const nodes = [];
      text.split("`").forEach((part, i) => {
        if (!part) return;
        nodes.push(i % 2 === 1 ? el("code", { text: part }) : document.createTextNode(part));
      });
      return nodes;
    }

    function buildVote(question) {
      const box = el("div", { class: "vote" });
      const label = el("span", { text: "Was this helpful?" });
      const yes = el("button", { type: "button", "data-helpful": "true", text: "Yes" });
      const no = el("button", { type: "button", "data-helpful": "false", text: "No" });
      const thanks = el("span", { hidden: "" });
      box.append(label, yes, no, thanks);

      const previous = readVotes()[question.id];
      const apply = (helpful) => {
        yes.disabled = no.disabled = true;
        yes.setAttribute("aria-pressed", String(helpful === true));
        no.setAttribute("aria-pressed", String(helpful === false));
        thanks.textContent = "Thanks for the feedback.";
        thanks.hidden = false;
      };
      if (previous !== undefined) apply(previous);

      for (const button of [yes, no]) {
        button.addEventListener("click", () => {
          const helpful = button.dataset.helpful === "true";
          saveVote(question.id, helpful);
          sendFeedback({ event: "vote", question_id: question.id, helpful });
          apply(helpful);
        });
      }
      return box;
    }

    function buildQuestion(question) {
      const answer = el("div", { class: "answer" }, question.answer.map((p) => el("p", {}, inline(p))));
      const children = [answer];
      if (question.links.length) {
        const links = question.links.map((link, i) => [
          i ? document.createTextNode(", ") : null,
          el("a", { href: link.href, text: link.title }),
        ]).flat().filter(Boolean);
        children.push(el("p", { class: "see-also" }, [document.createTextNode("See also: "), ...links]));
      }
      children.push(buildVote(question));
      return el("details", { "data-id": question.id }, [
        el("summary", { text: question.question }),
        ...children,
      ]);
    }

    // Build the page once. Filtering only toggles visibility.
    for (const topic of data.topics) {
      const questions = data.questions.filter((q) => q.topic === topic.id);
      if (!questions.length) continue;
      topicsEl.append(el("li", {}, [el("a", { href: `#${topic.id}`, text: topic.title })]));
      const section = el("section", { id: topic.id, "data-topic": topic.id }, [
        el("h2", { text: topic.title }),
        ...questions.map(buildQuestion),
      ]);
      sectionsEl.append(section);
    }

    // Each word of the query must appear in the question, tags, or answer.
    // Matches in the question rank highest, then tags, then the answer.
    function tokens(query) {
      return query.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
    }
    function scoreQuestion(question, words) {
      const title = question.question.toLowerCase();
      const tags = question.tags.join(" ").toLowerCase();
      const body = question.answer.join(" ").toLowerCase();
      let total = 0;
      for (const word of words) {
        const inTitle = title.includes(word);
        const inTags = tags.includes(word);
        const inBody = body.includes(word);
        if (!inTitle && !inTags && !inBody) return -1;
        total += (inTitle ? 3 : 0) + (inTags ? 2 : 0) + (inBody ? 1 : 0);
      }
      return total;
    }

    let feedbackTimer = null;
    function applySearch() {
      const query = search.value.trim();
      const words = tokens(query);
      let visible = 0;
      const scores = new Map();
      for (const question of data.questions) {
        const score = words.length ? scoreQuestion(question, words) : 0;
        if (score >= 0) scores.set(question.id, score);
      }
      const matching = words.length ? scores.size : data.questions.length;

      for (const section of sectionsEl.querySelectorAll("section")) {
        let sectionVisible = 0;
        for (const details of section.querySelectorAll("details")) {
          const id = details.dataset.id;
          const show = !words.length || scores.has(id);
          details.hidden = !show;
          if (show) sectionVisible++;
        }
        section.hidden = sectionVisible === 0;
        visible += sectionVisible;
      }
      for (const item of topicsEl.querySelectorAll("li")) {
        const target = document.getElementById(item.querySelector("a").getAttribute("href").slice(1));
        item.hidden = !target || target.hidden;
      }
      statusEl.textContent = words.length
        ? `${visible} of ${data.questions.length} questions match.`
        : "";

      clearTimeout(feedbackTimer);
      if (words.length && matching === 0) {
        feedbackTimer = setTimeout(() => {
          sendFeedback({ event: "no_results", query: query.slice(0, 200) });
        }, 800);
      }
    }

    search.addEventListener("input", applySearch);
    applySearch();
  </script>
</body>
</html>
