# Environment-specific configuration for Mainstay operations tooling.
#
# Every environment MUST define the full schema below. The loader in
# scripts/ops/config.py validates it, and CI (job `ops-tooling`) validates
# every environment on each push.
#
#   rpc_url, network_passphrase
#   [<env>.limits]    max_fee_stroops, max_batch_size
#   [<env>.timeouts]  rpc_timeout_secs, tx_timeout_secs
#   [<env>.rates]     max_requests_per_minute, max_submissions_per_hour
#   [<env>.logging]   level, retention_days
#   [<env>.canary]    stages, max_error_rate, max_p95_latency_ms,
#                     min_samples, observe_secs
#
# Promotion: `python3 -m scripts.ops.config diff --from staging --to mainnet`
# shows exactly which values differ before a change is promoted.

[dev]
rpc_url = "http://localhost:8000/soroban/rpc"
network_passphrase = "Standalone Network ; February 2017"

[dev.limits]
max_fee_stroops = 1000000
max_batch_size = 10

[dev.timeouts]
rpc_timeout_secs = 30
tx_timeout_secs = 60

[dev.rates]
# 0 disables submission rate limiting. Allowed for dev only.
max_requests_per_minute = 600
max_submissions_per_hour = 0

[dev.logging]
level = "DEBUG"
retention_days = 7

[dev.canary]
stages = [100]
max_error_rate = 0.5
max_p95_latency_ms = 5000
min_samples = 1
observe_secs = 0

[staging]
rpc_url = "https://soroban-testnet.stellar.org"
network_passphrase = "Test SDF Network ; September 2015"

[staging.limits]
max_fee_stroops = 10000000
